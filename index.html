<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Music Room</title>
    <!-- Tailwind CSS para diseño rápido y moderno estilo oscuro -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS para WebRTC simplificado -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Pantalla de Inicio / Configuración de Sala -->
    <div id="setup-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-black tracking-wider text-purple-400">RAVE WEB</h1>
                <p class="text-sm text-slate-400">Escucha música en grupo sin anuncios desde tu navegador</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Tu Apodo</label>
                    <input type="text" id="username-input" placeholder="Ej. Carlos" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Código de Sala</label>
                    <input type="text" id="room-input" placeholder="Ej. fiesta-colombia" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button id="btn-host" class="bg-purple-600 hover:bg-purple-500 font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-purple-600/30 text-center">
                        Crear Sala (Host)
                    </button>
                    <button id="btn-join" class="bg-slate-800 hover:bg-slate-700 font-bold py-3 px-4 rounded-lg transition border border-slate-700 text-center">
                        Entrar (Invitado)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pantalla Principal de la Sala (Oculta al inicio) -->
    <div id="room-screen" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Barra Superior -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                <h2 id="room-title" class="font-bold text-lg">Sala: <span class="text-purple-400">---</span></h2>
            </div>
            <div class="flex items-center space-x-4">
                <span id="role-badge" class="px-3 py-1 bg-purple-950 border border-purple-800 text-purple-300 text-xs font-semibold rounded-full">---</span>
                <button id="btn-leave" class="text-red-400 hover:text-red-300 text-sm font-semibold">Salir</button>
            </div>
        </header>

        <!-- Contenido Central: Reproductor / Audio + Chat -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 overflow-hidden">
            
            <!-- Columna Izquierda/Centro: Zona de Transmisión de Audio -->
            <div class="lg:col-span-2 flex flex-col items-center justify-center p-8 bg-slate-950 space-y-6 relative">
                
                <!-- Controles exclusivos para el Host -->
                <div id="host-controls" class="hidden flex flex-col items-center space-y-4 w-full max-w-md bg-slate-900/80 border border-slate-800 p-6 rounded-xl backdrop-blur">
                    <p class="text-sm text-slate-300 text-center">Comparte la pestaña de tu navegador (Spotify Web o YouTube) para transmitir audio sin anuncios.</p>
                    <button id="btn-share-audio" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 px-6 rounded-lg transition shadow-lg shadow-emerald-600/20">
                        🖥️ Compartir Pestaña de Audio
                    </button>
                </div>

                <!-- Estado del Invitado -->
                <div id="listener-controls" class="hidden flex flex-col items-center space-y-4 text-center">
                    <div class="w-24 h-24 bg-purple-900/30 border border-purple-500/30 rounded-full flex items-center justify-center text-4xl animate-bounce">
                        🎧
                    </div>
                    <p class="text-slate-400">Escuchando la transmisión en directo del Anfitrión...</p>
                    <!-- Elemento de audio invisible donde llega el flujo WebRTC -->
                    <audio id="remote-audio" autoplay></audio>
                </div>

                <!-- Animación visual de ondas de audio -->
                <div class="flex items-center space-x-1 h-12">
                    <div class="w-1 bg-purple-500 h-6 animate-pulse rounded-full"></div>
                    <div class="w-1 bg-purple-500 h-10 animate-pulse delay-75 rounded-full"></div>
                    <div class="w-1 bg-purple-500 h-4 animate-pulse delay-150 rounded-full"></div>
                    <div class="w-1 bg-purple-500 h-12 animate-pulse delay-300 rounded-full"></div>
                    <div class="w-1 bg-purple-500 h-8 animate-pulse rounded-full"></div>
                </div>
            </div>

            <!-- Columna Derecha: Chat y Participantes -->
            <div class="bg-slate-900 border-l border-slate-800 flex flex-col h-full">
                <div class="p-4 border-b border-slate-800 font-bold text-sm text-slate-400 uppercase tracking-wider">
                    Chat en Vivo de la Sala
                </div>
                
                <!-- Lista de mensajes -->
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                    <!-- Mensajes dinámicos -->
                </div>

                <!-- Input de chat -->
                <div class="p-4 border-t border-slate-800 bg-slate-950">
                    <form id="chat-form" class="flex gap-2">
                        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
                        <button type="submit" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-sm font-bold transition">Enviar</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Lógica de la Aplicación en JavaScript -->
    <script>
        // Configuración de Firebase (puedes usar tu propia base de datos de prueba o la de tu proyecto SeñorTendero)
        const firebaseConfig = {
            databaseURL: "https://srtendero2026-default-rtdb.firebaseio.com/" // Usando tu referencia de backend ya conocida
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let peer = null;
        let myStream = null;
        let roomId = null;
        let username = null;
        let isHost = false;

        const setupScreen = document.getElementById('setup-screen');
        const roomScreen = document.getElementById('room-screen');
        const usernameInput = document.getElementById('username-input');
        const roomInput = document.getElementById('room-input');
        
        document.getElementById('btn-host').addEventListener('click', () => startRoom(true));
        document.getElementById('btn-join').addEventListener('click', () => startRoom(false));

        function startRoom(hosting) {
            username = usernameInput.value.trim();
            roomId = roomInput.value.trim();

            if (!username || !roomId) {
                alert('Por favor ingresa tu apodo y el código de la sala.');
                return;
            }

            isHost = hosting;

            // Inicializar PeerJS (crea un ID único basado en el rol y sala)
            const peerId = isHost ? `host-${roomId}` : `guest-${Math.random().toString(36.substring(2, 7))}-${roomId}`;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                setupScreen.classList.add('hidden');
                roomScreen.classList.remove('hidden');
                document.getElementById('room-title').innerHTML = `Sala: <span class="text-purple-400">${roomId}</span>`;
                document.getElementById('role-badge').innerText = isHost ? 'ANFITRIÓN (HOST)' : 'OYENTE';

                if (isHost) {
                    document.getElementById('host-controls').classList.remove('hidden');
                } else {
                    document.getElementById('listener-controls').classList.remove('hidden');
                    connectToHost();
                }

                initChat();
            });

            peer.on('error', (err) => {
                console.error(err);
                alert('Error en la conexión P2P. Intenta de nuevo.');
            });
        }

        // Lógica del Anfitrión para capturar y enviar audio
        document.getElementById('btn-share-audio').addEventListener('click', async () => {
            try {
                // Pide compartir pestaña (es crucial marcar audio: true y sugerir systemAudio)
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                const audioTrack = myStream.getAudioTracks()[0];
                if (!audioTrack) {
                    alert('No seleccionaste una pestaña con audio o no diste permisos de audio.');
                    return;
                }

                const audioOnlyStream = new MediaStream([audioTrack]);
                document.getElementById('btn-share-audio').innerText = "Transmitiendo Audio Activo 🟢";
                document.getElementById('btn-share-audio').classList.remove('bg-emerald-600');
                document.getElementById('btn-share-audio').classList.add('bg-green-700');

                // Escuchar cuando un invitado se conecte llamando al host
                peer.on('call', (call) => {
                    call.answer(audioOnlyStream); // Le enviamos nuestro stream de audio directo
                });

            } catch (err) {
                console.error("Error al capturar pantalla/audio:", err);
            }
        });

        // Lógica del Invitado para conectarse al Host
        function connectToHost() {
            const hostPeerId = `host-${roomId}`;
            // Intentamos llamar al host para recibir su stream de audio
            setTimeout(() => {
                const call = peer.call(hostPeerId, new MediaStream());
                call.on('stream', (remoteStream) => {
                    const audioElement = document.getElementById('remote-audio');
                    audioElement.srcObject = remoteStream;
                    audioElement.play().catch(e => console.log("Autoplay bloqueado, haz clic en la página"));
                });
            }, 1000);
        }

        // Sistema de Chat sincronizado con Firebase Realtime Database
        function initChat() {
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const chatMessages = document.getElementById('chat-messages');

            const chatRef = db.ref(`rooms/${roomId}/chat`);

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = chatInput.value.trim();
                if (!text) return;

                chatRef.push({
                    username: username,
                    text: text,
                    timestamp: Date.now()
                });

                chatInput.value = '';
            });

            // Escuchar nuevos mensajes en tiempo real
            chatRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const msgDiv = document.createElement('div');
                msgDiv.innerHTML = `<span class="font-bold text-purple-400">${msg.username}:</span> <span class="text-slate-200">${msg.text}</span>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // Salir de la sala
        document.getElementById('btn-leave').addEventListener('click', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
